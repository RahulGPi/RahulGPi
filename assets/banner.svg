<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
  <title id="title">Rahul Pai · AI systems engineering</title>
  <desc id="desc">Three layers of an isometric token cache. TriTierCache achieved 5.2× compression against FP32 at 32,768 tokens.</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#809d36" stop-opacity=".25"/>
      <stop offset="1" stop-color="#809d36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x2="1" y2=".2">
      <stop stop-color="#71834a"/>
      <stop offset=".55" stop-color="#35422a"/>
      <stop offset="1" stop-color="#171e14"/>
    </linearGradient>
    <pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="8.4" height="8.4" rx=".6" fill="#728450"/>
    </pattern>
    <pattern id="medium" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="17.6" height="17.6" rx="1" fill="#53653c"/>
    </pattern>
    <pattern id="coarse" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="27" height="27" rx="1.2" fill="#3e4b31"/>
      <path d="M1 26V1h25" fill="none" stroke="#657749"/>
    </pattern>
    <g id="slab">
      <path d="M-150 69 90 155.4v10L-150 79z" fill="url(#edge)"/>
      <path d="M90 155.4 240 86.4v10l-150 69z" fill="#263021"/>
      <path d="M0 0 240 86.4 90 155.4-150 69z" fill="#171d14"/>
    </g>
    <style>
      @keyframes read { 0%, 100% { opacity: 1; } 50% { opacity: .44; } }
      @media (prefers-reduced-motion: no-preference) {
        .read-a { animation: read 4s ease-in-out infinite; }
        .read-b { animation: read 4s -1.3s ease-in-out infinite; }
      }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1079" height="369" rx="20" fill="#10120f" stroke="#34392c"/>
  <ellipse cx="836" cy="269" rx="235" ry="92" fill="url(#glow)"/>

  <!-- Three independently packed planes of the cache. -->
  <g transform="translate(790 147)">
    <use xlink:href="#slab"/>
    <g transform="matrix(1 .36 -1 .46 0 0)">
      <rect width="240" height="150" fill="url(#fine)"/>
      <path d="M20 110h8v8h-8zm10 0h8v8h-8zm10 0h8v8h-8zm10 0h8v8h-8zm10 0h8v8h-8z" fill="#b0c479"/>
    </g>
  </g>
  <g transform="translate(790 91)">
    <use xlink:href="#slab"/>
    <g transform="matrix(1 .36 -1 .46 0 0)">
      <rect width="240" height="150" fill="url(#medium)"/>
      <path d="M20 100h17v17H20zm60 20h17v17H80zm80-40h17v17h-17zm60 40h17v17h-17z" fill="#b6cd79"/>
    </g>
  </g>
  <g transform="translate(790 35)">
    <use xlink:href="#slab"/>
    <g transform="matrix(1 .36 -1 .46 0 0)">
      <rect width="240" height="150" fill="url(#coarse)"/>
      <g fill="#d0f463">
        <path d="M0 90h27v27H0zm30 0h27v27H30zm30 0h27v27H60z"/>
        <path class="read-a" d="M90 90h27v27H90zm0-30h27v27H90zm30 0h27v27h-27z"/>
        <path class="read-b" d="M150 60h27v27h-27zm0-30h27v27h-27zm30 0h27v27h-27z"/>
      </g>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g font-family="'IBM Plex Mono', monospace" font-size="17" letter-spacing="1.6" fill="#cdf267">
      <text x="47" y="53">@RahulGPi</text>
      <path d="M171 47h33" stroke="#879e4d"/>
    </g>
    <text x="42" y="151" font-size="87" font-weight="700" letter-spacing="-5" fill="#f2f3e8">Rahul Pai</text>
    <text x="47" y="197" font-size="29" fill="#e0e4d6">AI systems engineering</text>
    <text x="47" y="234" font-size="23" fill="#afb5a6">LLM inference, agents, and data tools.</text>
    <text x="44" y="329" font-size="53" font-weight="700" letter-spacing="-2" fill="#cdf267">5.2×</text>
    <g font-size="18" fill="#bac1ae">
      <text x="177" y="307">KV cache compression vs. FP32</text>
      <text x="177" y="332">TriTierCache · 32k tokens</text>
    </g>
  </g>
</svg>
